services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: myanimelogs_nginx_prod
    ports:
      - "80:80"
      - "443:443" # SSL/TLS用
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./certbot/conf:/etc/letsencrypt # Certbotを使用する場合のSSL証明書用
      # - ./certbot/www:/var/www/certbot # CertbotのWebroot認証用
    depends_on:
      - frontend
      - backend
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: myanimelogs_frontend_prod
    env_file:
      - ./frontend/.env.production # 本番用.envファイルを想定
    # ポートは直接公開せず、Nginxがプロキシします
    # ホットリロード用のボリュームは不要です
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: myanimelogs_backend_prod
    env_file:
      - ./backend/.env.production # 本番用.envファイルを想定
    ports:
      - "8080:8080" # バックエンドAPIポート。Nginxがすべてプロキシする場合は内部のみでも可
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"] # ヘルスエンドポイントを想定
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5' # CPUコアを0.5に制限
          memory: 512M # メモリを512MBに制限
    restart: always

  postgres:
    image: postgres:16-alpine # 本番環境ではイメージサイズを小さくするためにalpineを使用
    container_name: myanimelogs_postgres_prod
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data # 本番データ用の独立したボリューム
    env_file:
      - ./backend/.env.production # データベース認証情報に本番用.envを使用
    # セキュリティのため、ホストにポートを直接公開しません（内部ネットワークのみ）
    restart: always

volumes:
  postgres_data_prod:
