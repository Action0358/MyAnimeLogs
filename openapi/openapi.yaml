openapi: 3.0.0
info:
  title: MyAnimeLogs API
  version: 1.0.0
  description: API for MyAnimeLogs application
servers:
  - url: ${API_URL}
paths:
  /register:
    post:
      summary: 新規ユーザー作成
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: "山田 太郎"
                email:
                  type: string
                  format: email
                  example: "taro@example.com"
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: "password123"
              required:
                - name
                - email
                - password
      responses:
        "201":
          description: ユーザー登録が完了しました
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "ユーザー登録が完了しました。"
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: メールアドレスが既に登録済み
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /login:
    post:
      summary: 認証トークン発行
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
              required:
                - email
                - password
      responses:
        "200":
          description: ログイン成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: "eyJ..."
                  token_type:
                    type: string
                    example: "Bearer"
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          description: 認証失敗（メールアドレスまたはパスワードが正しくない）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "メールアドレスまたはパスワードが正しくありません"
        "403":
          description: アカウントロック（5回連続でログイン失敗した場合、15分間ロック）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "アカウントがロックされています。しばらく時間をおいてから再試行してください。"
  /users/me:
    get:
      summary: マイページ情報を取得
      security:
        - bearerAuth: []
      responses:
        "200":
          description: マイページ情報
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: 認証が必要です
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: マイページ情報を更新
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: "山田 太郎"
                description:
                  type: string
                  maxLength: 10000
                  example: "アニメが大好きです"
                favorite_anime:
                  type: string
                  maxLength: 300
                  example: "鬼滅の刃、進撃の巨人"
                sns_link:
                  type: string
                  format: uri
                  maxLength: 500
                  example: "https://twitter.com/example"
      responses:
        "200":
          description: プロフィールを更新しました
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "プロフィールを更新しました。"
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 認証が必要です
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/me/icon:
    post:
      summary: プロフィール画像をアップロード
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                icon:
                  type: string
                  format: binary
                  description: アップロードする画像ファイル（JPEG, PNG, GIF, WebP）
              required:
                - icon
      responses:
        "200":
          description: プロフィール画像を更新しました
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "プロフィール画像を更新しました。"
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 認証が必要です
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 画像の保存に失敗しました
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: プロフィール画像を削除
      security:
        - bearerAuth: []
      responses:
        "200":
          description: プロフィール画像を削除しました
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "プロフィール画像を削除しました"
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          description: プロフィール画像が設定されていません
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 認証が必要です
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: プロフィール画像の削除に失敗しました
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/me/export:
    get:
      summary: ユーザーデータのエクスポート
      security:
        - bearerAuth: []
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: ["json", "csv"]
            default: "json"
      responses:
        "200":
          description: エクスポートデータ
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_info:
                    $ref: "#/components/schemas/User"
                  favorites:
                    type: array
                    items:
                      $ref: "#/components/schemas/Favorite"
                  watch_history:
                    type: array
                    items:
                      $ref: "#/components/schemas/WatchHistory"
                  ratings:
                    type: array
                    items:
                      $ref: "#/components/schemas/Rating"
            text/csv:
              schema:
                type: string
  /animes:
    get:
      summary: アニメ検索・一覧取得
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
          description: タイトル・説明で部分一致
        - name: season
          in: query
          schema:
            type: string
          example: "2025-summer"
        - name: status
          in: query
          schema:
            type: string
            enum: ["airing", "finished"]
        - name: genre
          in: query
          schema:
            type: string
          description: ジャンルで絞り込み
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: アニメ一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Anime"
                  meta:
                    type: object
                    properties:
                      total_pages:
                        type: integer
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
  /animes/{id}:
    get:
      summary: 指定アニメの詳細情報取得
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: アニメ詳細情報
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Anime"
        "404":
          description: アニメが見つかりません
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /animes/{id}/episodes:
    get:
      summary: 指定アニメのエピソード一覧取得
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: エピソード一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  anime_id:
                    type: integer
                  anime_title:
                    type: string
                  episodes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Episode"
        "404":
          description: アニメが見つかりません
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/me/favorites:
    get:
      summary: 自分のお気に入りアニメ一覧取得
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: ["watching", "completed", "planned", "dropped"]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Anime"
  /users/me/favorites/{anime_id}:
    put:
      summary: お気に入りにアニメを追加・更新
      security:
        - bearerAuth: []
      parameters:
        - name: anime_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: ["watching", "completed", "planned", "dropped"]
              required:
                - status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Favorite"
    delete:
      summary: お気に入りからアニメを削除
      security:
        - bearerAuth: []
      parameters:
        - name: anime_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content
  /episodes/{episode_id}/watch:
    put:
      summary: エピソードの視聴状態を更新
      security:
        - bearerAuth: []
      parameters:
        - name: episode_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                viewed:
                  type: boolean
              required:
                - viewed
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  viewed:
                    type: boolean
  /users/me/stats:
    get:
      summary: ユーザーの視聴統計情報取得
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 視聴統計情報
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_episodes_watched:
                    type: integer
                    example: 245
                  total_animes_completed:
                    type: integer
                    example: 12
                  total_watch_time_hours:
                    type: number
                    format: float
                    example: 98.5
                  favorite_genres:
                    type: array
                    items:
                      type: string
                    example: ["アクション", "SF"]
                  this_month_episodes:
                    type: integer
                    example: 15
  /users/me/recently-watched:
    get:
      summary: 最近視聴したエピソード一覧
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: 最近視聴したエピソード一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecentlyWatchedEpisode"
  /animes/{id}/rating:
    put:
      summary: アニメの評価を登録・更新
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating:
                  type: number
                  format: float
                  minimum: 1.0
                  maximum: 5.0
                comment:
                  type: string
                  maxLength: 1000
              required:
                - rating
      responses:
        "200":
          description: 評価を登録しました
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  rating:
                    $ref: "#/components/schemas/Rating"
    delete:
      summary: アニメの評価を削除
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 評価を削除しました
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /users/me/watchlist:
    get:
      summary: 視聴予定リスト取得
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 視聴予定のアニメ一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchlistItem"
  /search/animes:
    get:
      summary: 基本的なアニメ検索
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: 検索クエリ
        - name: genre
          in: query
          schema:
            type: string
          description: ジャンル絞り込み
        - name: year
          in: query
          schema:
            type: integer
          description: 放送年絞り込み
        - name: sort
          in: query
          schema:
            type: string
            enum: ["title", "rating", "year"]
          description: ソート条件
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: 検索結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchResultAnime"
                  meta:
                    type: object
                    properties:
                      total_pages:
                        type: integer
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
  /search/advanced:
    get:
      summary: 高度なアニメ検索
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: 検索クエリ
        - name: genres
          in: query
          schema:
            type: array
            items:
              type: string
          description: ジャンル絞り込み（複数指定可）
        - name: year
          in: query
          schema:
            type: integer
          description: 放送年絞り込み
        - name: season
          in: query
          schema:
            type: string
            enum: ["spring", "summer", "autumn", "winter"]
          description: シーズン絞り込み
        - name: min_rating
          in: query
          schema:
            type: number
            format: float
            minimum: 1.0
            maximum: 5.0
          description: 最低評価
        - name: max_rating
          in: query
          schema:
            type: number
            format: float
            minimum: 1.0
            maximum: 5.0
          description: 最高評価
        - name: status
          in: query
          schema:
            type: string
            enum: ["airing", "finished"]
          description: 放送状態
        - name: user_status
          in: query
          schema:
            type: string
            enum: ["watching", "completed", "planned", "dropped"]
          description: ユーザーの視聴ステータス（認証時のみ）
        - name: sort
          in: query
          schema:
            type: string
            enum: ["title", "rating", "year", "popularity", "updated"]
            default: "title"
          description: ソート条件
        - name: order
          in: query
          schema:
            type: string
            enum: ["asc", "desc"]
            default: "asc"
          description: ソート順
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: 検索結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchResultAnime"
                  meta:
                    type: object
                    properties:
                      total_pages:
                        type: integer
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
  /search/suggestions:
    get:
      summary: 検索候補を取得
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: 検索クエリ
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: 取得件数
      responses:
        "200":
          description: 検索候補一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      type: string
                    example: ["進撃の巨人", "進撃の巨人 Season 2"]
  /search/popular:
    get:
      summary: 人気検索キーワードを取得
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: 取得件数
      responses:
        "200":
          description: 人気検索キーワード一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  popular_searches:
                    type: array
                    items:
                      type: string
                    example: ["進撃の巨人", "鬼滅の刃", "呪術廻戦"]
  /search/history:
    get:
      summary: 検索履歴を取得
      description: ログインユーザーの検索履歴を取得
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
          description: 取得件数（最大50件）
      responses:
        "200":
          description: 検索履歴一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchLog"
                  total:
                    type: integer
        "401":
          description: 認証が必要です
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: 検索履歴を全件削除
      description: ログインユーザーの検索履歴を全て削除
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 検索履歴を削除しました
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "検索履歴を削除しました"
        "401":
          description: 認証が必要です
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /search/history/{id}:
    delete:
      summary: 検索履歴を個別削除
      description: 指定した検索履歴を削除
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 検索履歴ID
      responses:
        "200":
          description: 検索履歴を削除しました
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "検索履歴を削除しました"
        "401":
          description: 認証が必要です
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 検索履歴が見つかりません
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /filters:
    get:
      summary: フィルター情報を取得
      description: 検索フィルターに使用可能なジャンル、年、シーズン、評価情報を取得
      responses:
        "200":
          description: フィルター情報
          content:
            application/json:
              schema:
                type: object
                properties:
                  genres:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        count:
                          type: integer
                  years:
                    type: array
                    items:
                      type: integer
                  seasons:
                    type: array
                    items:
                      type: string
                      enum: ["spring", "summer", "autumn", "winter"]
                  ratings:
                    type: object
                    properties:
                      min:
                        type: number
                        format: float
                      max:
                        type: number
                        format: float
                      average:
                        type: number
                        format: float
                      count:
                        type: integer
  /annict/works:
    get:
      summary: Annict APIからアニメ作品を取得
      parameters:
        - name: season
          in: query
          schema:
            type: string
          description: シーズン（例：2025-autumn）
      responses:
        "200":
          description: Annictアニメ作品一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  works:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnnictWork"
                  total_count:
                    type: integer
  /annict/popular-works:
    get:
      summary: Annict APIから人気アニメ作品を取得
      responses:
        "200":
          description: 人気アニメ作品一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  works:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnnictWork"
                  total_count:
                    type: integer
  /annict/test:
    get:
      summary: Annict API接続テスト（開発環境のみ）
      description: Annict APIへの接続をテストします。開発環境でのみ利用可能です。
      responses:
        "200":
          description: 接続成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Annict API connection successful"
        "500":
          description: 接続失敗
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  error:
                    type: string
                    example: "Failed to connect to Annict API"
  /admin/sync/season:
    post:
      summary: シーズンアニメをデータベースに同期
      security:
        - bearerAuth: []
      parameters:
        - name: season
          in: query
          schema:
            type: string
          description: シーズン（例：2025-autumn）
      responses:
        "200":
          description: 同期成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  synced_count:
                    type: integer
        "401":
          description: 認証が必要です
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/sync/popular:
    post:
      summary: 人気アニメをデータベースに同期
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 同期成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  synced_count:
                    type: integer
        "401":
          description: 認証が必要です
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/errors/metrics:
    get:
      summary: エラーメトリクスを取得
      security:
        - bearerAuth: []
      responses:
        "200":
          description: エラーメトリクス
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_errors:
                    type: integer
                  error_rate:
                    type: number
                    format: float
                  errors_by_type:
                    type: object
                    additionalProperties:
                      type: integer
  /admin/errors/top:
    get:
      summary: トップエラーを取得
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: sort
          in: query
          schema:
            type: string
            enum: ["count", "rate"]
            default: "count"
      responses:
        "200":
          description: トップエラー一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    error_code:
                      type: string
                    count:
                      type: integer
                    rate:
                      type: number
                      format: float
  /admin/errors/reset:
    post:
      summary: エラーメトリクスをリセット
      security:
        - bearerAuth: []
      responses:
        "200":
          description: リセット成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /admin/sync/episode-durations:
    post:
      summary: エピソード視聴時間をJikan APIから同期
      description: Jikan APIからエピソードの視聴時間を取得してデータベースに保存します
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                anime_id:
                  type: integer
                  description: 同期対象のアニメID（未指定の場合は全アニメ）
                  example: 123
      responses:
        "200":
          description: 同期完了
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_animes:
                    type: integer
                    description: 処理対象のアニメ数
                    example: 100
                  success_count:
                    type: integer
                    description: 成功した同期数
                    example: 95
                  failure_count:
                    type: integer
                    description: 失敗した同期数
                    example: 3
                  skipped_count:
                    type: integer
                    description: スキップされた同期数
                    example: 2
                  errors:
                    type: array
                    description: エラーメッセージのリスト
                    items:
                      type: string
                    example: ["Anime ID 456: MAL ID not found"]
        "400":
          description: リクエストエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 認証エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/sync/episodes:
    post:
      summary: エピソード情報をJikan APIから同期
      description: Jikan API（MyAnimeList）からエピソード情報を取得してデータベースに保存します。タイトル、放送日、再生時間、特別編フラグ（filler/recap）を同期します。
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                anime_id:
                  type: integer
                  description: 同期対象のアニメID（省略時は全アニメ）
                  example: 1
      responses:
        "200":
          description: エピソード同期完了
          content:
            application/json:
              schema:
                type: object
                properties:
                  success_count:
                    type: integer
                    description: 成功したアニメ数
                    example: 92
                  failure_count:
                    type: integer
                    description: 失敗したアニメ数
                    example: 8
                  errors:
                    type: array
                    description: エラーメッセージのリスト
                    items:
                      type: string
                    example:
                      - "Anime ID 29: failed to fetch episodes from Jikan: rate limit exceeded"
                  message:
                    type: string
                    description: 処理結果メッセージ
                    example: "Episode sync completed: 92 succeeded, 8 failed"
        "400":
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 認証エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/sync/genres:
    post:
      summary: アニメジャンル情報をAniList APIから同期
      description: AniList APIからジャンル情報を取得してデータベースに保存します。MAL IDが設定されている全アニメを処理します。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: ジャンル同期完了
          content:
            application/json:
              schema:
                type: object
                properties:
                  success_count:
                    type: integer
                    description: 成功したアニメ数
                    example: 95
                  failure_count:
                    type: integer
                    description: 失敗したアニメ数
                    example: 5
                  errors:
                    type: array
                    description: エラーメッセージのリスト
                    items:
                      type: string
                    example:
                      - "Anime ID 10 (MAL ID 12345): failed to fetch genres from AniList: Media not found"
                      - "Anime ID 20 (MAL ID 67890): rate limited after 3 attempts"
                  message:
                    type: string
                    description: 処理結果メッセージ
                    example: "Genre sync completed: 95 succeeded, 5 failed"
        "401":
          description: 認証エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/episode-sync-status:
    get:
      summary: エピソード同期ステータスを取得
      description: 特定のアニメのエピソード同期状況を取得します
      security:
        - bearerAuth: []
      parameters:
        - name: anime_id
          in: query
          required: true
          schema:
            type: integer
          description: 確認対象のアニメID
          example: 1
      responses:
        "200":
          description: エピソード同期ステータス
          content:
            application/json:
              schema:
                type: object
                properties:
                  anime_id:
                    type: integer
                    description: アニメID
                    example: 1
                  anime_title:
                    type: string
                    description: アニメタイトル
                    example: "SPY×FAMILY Season 2"
                  annict_id:
                    type: integer
                    nullable: true
                    description: Annict ID
                    example: 7894
                  total_episodes:
                    type: integer
                    description: 総エピソード数
                    example: 12
                  default_titles:
                    type: integer
                    description: デフォルトタイトル（第X話）の数
                    example: 3
                  custom_titles:
                    type: integer
                    description: カスタムタイトルの数
                    example: 9
                  sync_percentage:
                    type: number
                    format: float
                    description: 同期率（%）
                    example: 75.0
                  need_sync:
                    type: boolean
                    description: 同期が必要かどうか
                    example: true
                  sample_episodes:
                    type: array
                    description: サンプルエピソード（最大5件）
                    items:
                      type: string
                    example:
                      - "Ep1: 白い嫉妬／イーデン校バスジャック事件"
                      - "Ep2: 第2話"
                      - "Ep3: 第3話"
        "400":
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 認証エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: アニメが見つかりません
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/sync/status:
    get:
      summary: 同期ステータスを取得
      description: アニメ同期スケジューラーの現在のステータスを取得します
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 同期ステータス
          content:
            application/json:
              schema:
                type: object
                properties:
                  last_sync_time:
                    type: string
                    format: date-time
                    description: 最後の同期時刻
                  next_sync_time:
                    type: string
                    format: date-time
                    description: 次回の同期時刻
                  last_sync_duration:
                    type: string
                    description: 最後の同期にかかった時間
                    example: "2m30s"
                  last_sync_success:
                    type: boolean
                    description: 最後の同期が成功したか
                  last_sync_count:
                    type: integer
                    description: 最後の同期で処理したアニメ数
                    example: 95
                  last_sync_errors:
                    type: array
                    items:
                      type: string
                    description: 最後の同期で発生したエラー
                  total_syncs_today:
                    type: integer
                    description: 今日の同期実行回数
                    example: 1
                  is_running:
                    type: boolean
                    description: 現在同期中かどうか
                  enabled:
                    type: boolean
                    description: スケジューラーが有効かどうか
                  current_season:
                    type: string
                    description: 現在のシーズン
                    example: "2025-autumn"
                  previous_season:
                    type: string
                    description: 前シーズン
                    example: "2025-summer"
        "401":
          description: 認証エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: スケジューラーが利用できない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /health:
    get:
      summary: ヘルスチェック
      responses:
        "200":
          description: サービスは正常です
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  timestamp:
                    type: string
                    format: date-time
  /health/detailed:
    get:
      summary: 詳細ヘルスチェック
      responses:
        "200":
          description: 詳細なヘルスチェック情報
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  checks:
                    type: object
                    properties:
                      database:
                        type: object
                        properties:
                          status:
                            type: string
                          latency:
                            type: number
                      external_api:
                        type: object
                        properties:
                          status:
                            type: string
                          latency:
                            type: number
                  timestamp:
                    type: string
                    format: date-time
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error_code:
          type: string
          example: "VALIDATION_ERROR"
        message:
          type: string
          example: "バリデーションエラーです"
        details:
          type: object
      required:
        - error_code
        - message
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "山田 太郎"
        email:
          type: string
          format: email
          example: "taro@example.com"
        description:
          type: string
          nullable: true
          maxLength: 10000
          example: "アニメが大好きです"
        icon:
          type: string
          format: uri
          nullable: true
          example: "https://example.com/uploads/icons/user_1_icon.jpg"
        favorite_anime:
          type: string
          nullable: true
          maxLength: 300
          example: "鬼滅の刃、進撃の巨人"
        sns_link:
          type: string
          format: uri
          nullable: true
          maxLength: 500
          example: "https://twitter.com/example"
        created_at:
          type: string
          format: date-time
          example: "2025-01-01T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-01-15T12:30:00Z"
    Anime:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        image_url:
          type: string
          format: uri
        season:
          type: string
        status:
          type: string
          enum: ["airing", "finished"]
        cover_image_extra_large:
          type: string
          format: uri
          description: AniList API から取得した最高画質のカバー画像URL（extraLargeサイズ）
        cover_image_large:
          type: string
          format: uri
          description: AniList API から取得した大サイズのカバー画像URL
        cover_image_medium:
          type: string
          format: uri
          description: AniList API から取得した中サイズのカバー画像URL
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Episode:
      type: object
      properties:
        id:
          type: integer
        anime_id:
          type: integer
        title:
          type: string
        episode_number:
          type: integer
        duration_minutes:
          type: integer
          nullable: true
          description: エピソードの視聴時間（分）
          example: 24
        is_special:
          type: boolean
          description: 特別編かどうか
          default: false
        filler:
          type: boolean
          description: フィラーエピソードかどうか
          default: false
        recap:
          type: boolean
          description: 総集編かどうか
          default: false
        viewed:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Favorite:
      type: object
      properties:
        anime_id:
          type: integer
        status:
          type: string
          enum: ["watching", "completed", "planned", "dropped"]
        added_at:
          type: string
          format: date-time
    WatchHistory:
      type: object
      properties:
        episode_id:
          type: integer
        watched_at:
          type: string
          format: date-time
    Rating:
      type: object
      properties:
        anime_id:
          type: integer
        rating:
          type: number
          format: float
          minimum: 1.0
          maximum: 5.0
        comment:
          type: string
        created_at:
          type: string
          format: date-time
    RecentlyWatchedEpisode:
      type: object
      properties:
        episode_id:
          type: integer
        anime_title:
          type: string
        episode_title:
          type: string
        watched_at:
          type: string
          format: date-time
    WatchlistItem:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        season:
          type: string
        added_at:
          type: string
          format: date-time
    SearchResultAnime:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        rating:
          type: number
          format: float
        genre:
          type: array
          items:
            type: string
    AnnictWork:
      type: object
      properties:
        id:
          type: integer
          description: Annict作品ID
        title:
          type: string
          description: 作品タイトル
        title_kana:
          type: string
          description: 作品タイトル（かな）
        title_en:
          type: string
          description: 作品タイトル（英語）
        media:
          type: string
          description: メディアタイプコード
          example: "tv"
        media_text:
          type: string
          description: メディアタイプ表示名
          example: "TV"
        season_name:
          type: string
          description: シーズン名
          example: "2025-autumn"
        season_year:
          type: integer
          description: 放送年
          example: 2025
        released_on:
          type: string
          description: 放送開始日
          example: "2025-10-01"
        released_on_about:
          type: string
          description: 放送開始日（概算）
          example: "2025年10月"
        official_site_url:
          type: string
          format: uri
          description: 公式サイトURL
        wikipedia_url:
          type: string
          format: uri
          description: Wikipedia URL
        twitter_username:
          type: string
          description: Twitter ユーザー名
        twitter_hashtag:
          type: string
          description: Twitter ハッシュタグ
        mal_anime_id:
          type: string
          nullable: true
          description: MyAnimeList ID（nullの場合あり）
        images:
          type: object
          nullable: true
          description: Annict API画像情報
          properties:
            recommended_url:
              type: string
              format: uri
            facebook:
              type: object
              nullable: true
              properties:
                og_image_url:
                  type: string
                  format: uri
            twitter:
              type: object
              nullable: true
              properties:
                mini_avatar_url:
                  type: string
                  format: uri
                normal_avatar_url:
                  type: string
                  format: uri
                bigger_avatar_url:
                  type: string
                  format: uri
                original_avatar_url:
                  type: string
                  format: uri
                image_url:
                  type: string
                  format: uri
        episodes_count:
          type: integer
          description: エピソード数
          example: 12
        watchers_count:
          type: integer
          description: 視聴者数
          example: 1000
        reviews_count:
          type: integer
          description: レビュー数
          example: 50
        no_episodes:
          type: boolean
          description: エピソード情報なしフラグ
        cover_image_extra_large:
          type: string
          format: uri
          description: AniList APIから取得した最高画質カバー画像URL（extraLargeサイズ）
        cover_image_large:
          type: string
          format: uri
          description: AniList APIから取得した大サイズカバー画像URL
        cover_image_medium:
          type: string
          format: uri
          description: AniList APIから取得した中サイズカバー画像URL
    SearchLog:
      type: object
      properties:
        id:
          type: integer
          description: 検索ログID
        user_id:
          type: integer
          nullable: true
          description: ユーザーID
        query:
          type: string
          description: 検索クエリ
          example: "進撃の巨人"
        filters:
          type: string
          description: 検索フィルター（JSON文字列）
          example: '{"genre":"action","season":"2025-winter"}'
        result_count:
          type: integer
          description: 検索結果件数
          example: 15
        clicked_anime_id:
          type: integer
          nullable: true
          description: クリックしたアニメID
        searched_at:
          type: string
          format: date-time
          description: 検索日時
          example: "2025-01-15T12:30:00Z"
