openapi: 3.0.0
info:
  title: MyAnimeLogs API
  version: 2.0.0
  description: |
    MyAnimeLogs API。認証はSupabase Authが担当します。

    ## 認証
    認証手段はGoogleソーシャルログインのみです。ログイン・ログアウトはすべてSupabase Auth API経由で行います。
    バックエンドAPIへのリクエストには、Supabase発行のJWTアクセストークンを `Authorization: Bearer <token>` で指定してください。

    Supabaseのauth.usersと連携するpublic.usersレコードは、初回APIアクセス時に自動作成されます。
    このとき表示名（name）は、JWTのuser_metadataに含まれるGoogleプロフィール名から設定されます。
servers:
  - url: ${API_URL}
paths:
  /users/me:
    get:
      summary: マイページ情報を取得
      security:
        - bearerAuth: []
      responses:
        "200":
          description: マイページ情報
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: 認証が必要です
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: アカウントを削除
      description: |
        アカウントを完全に削除します。**復旧はできません。**

        auth.users の削除に伴い、public.users・お気に入り・視聴状況・検索ログが連鎖削除されます。

        削除後もJWTは有効期限（最大1時間）まで残るため、
        クライアントは成功後ただちにサインアウトしてトークンを破棄してください。
        削除済みアカウントからのリクエストには 401 を返します。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: アカウントを削除しました
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "アカウントを削除しました"
        "401":
          description: 認証が必要です（削除済みアカウントからのリクエストを含む）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: |
            アカウント削除機能が利用できません。
            SUPABASE_SERVICE_ROLE_KEY が未設定の環境で返ります。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /animes:
    get:
      summary: アニメ検索・一覧取得
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
          description: タイトル・説明で部分一致
        - name: season
          in: query
          schema:
            type: string
          example: "2025-summer"
        - name: status
          in: query
          schema:
            type: string
            enum: ["airing", "finished", "not_yet_aired"]
        - name: genre
          in: query
          schema:
            type: string
          example: "アクション,ドラマ"
          description: >-
            ジャンルで絞り込み。カンマ区切りで複数指定でき、
            指定したいずれかのジャンルを持つ作品を返す（OR）。
        - name: media
          in: query
          schema:
            type: string
            enum: ["tv", "web", "movie"]
          description: メディア種別で絞り込み（大文字小文字を区別しない）
        - name: sort
          in: query
          schema:
            type: string
            enum: ["title", "year", "popularity"]
            default: "title"
          description: >-
            並び替え。title=タイトル順（五十音）、year=放送年順（新しい順）、
            popularity=人気順（視聴者数の多い順）
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: アニメ一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Anime"
                  meta:
                    type: object
                    properties:
                      total_pages:
                        type: integer
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
  /animes/{id}:
    get:
      summary: 指定アニメの詳細情報取得
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: アニメ詳細情報
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Anime"
        "404":
          description: アニメが見つかりません
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/me/favorites:
    get:
      summary: 自分のお気に入り（ハート）アニメ一覧取得
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Anime"
  /users/me/favorites/{anime_id}:
    put:
      summary: お気に入り（ハート）にアニメを追加
      security:
        - bearerAuth: []
      parameters:
        - name: anime_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Favorite"
    delete:
      summary: お気に入りからアニメを削除
      security:
        - bearerAuth: []
      parameters:
        - name: anime_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content
  /users/me/watch-status:
    get:
      summary: 自分の視聴ステータス一覧取得
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: ["watching", "completed", "planned"]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Anime"
  /users/me/watch-status/{anime_id}:
    put:
      summary: 視聴ステータスを設定・更新
      security:
        - bearerAuth: []
      parameters:
        - name: anime_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: ["watching", "completed", "planned"]
              required:
                - status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchStatus"
    delete:
      summary: 視聴ステータスを削除
      security:
        - bearerAuth: []
      parameters:
        - name: anime_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content
  /search/animes:
    get:
      summary: 基本的なアニメ検索
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: 検索クエリ
        - name: genre
          in: query
          schema:
            type: string
          example: "アクション,ドラマ"
          description: >-
            ジャンル絞り込み。カンマ区切りで複数指定でき、
            指定したいずれかのジャンルを持つ作品を返す（OR）。
        - name: year
          in: query
          schema:
            type: integer
          description: 放送年絞り込み
        - name: sort
          in: query
          schema:
            type: string
            enum: ["title", "year"]
          description: ソート条件
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: 検索結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchResultAnime"
                  meta:
                    type: object
                    properties:
                      total_pages:
                        type: integer
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
  /search/advanced:
    get:
      summary: 高度なアニメ検索
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: 検索クエリ
        - name: genres
          in: query
          schema:
            type: array
            items:
              type: string
          description: ジャンル絞り込み（複数指定可）
        - name: year
          in: query
          schema:
            type: integer
          description: 放送年絞り込み
        - name: season
          in: query
          schema:
            type: string
          description: 放送時期絞り込み（形式 YYYY-season または YYYY年季節）
          example: "2024-spring"
        - name: status
          in: query
          schema:
            type: string
            enum: ["airing", "finished", "not_yet_aired"]
          description: 放送状態
        - name: user_status
          in: query
          schema:
            type: string
            enum: ["watching", "completed", "planned"]
          description: ユーザーの視聴ステータス（認証時のみ）
        - name: sort
          in: query
          schema:
            type: string
            enum: ["title", "year", "popularity", "updated"]
            default: "title"
          description: ソート条件
        - name: order
          in: query
          schema:
            type: string
            enum: ["asc", "desc"]
            default: "asc"
          description: ソート順
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: 検索結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchResultAnime"
                  meta:
                    type: object
                    properties:
                      total_pages:
                        type: integer
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
  /search/suggestions:
    get:
      summary: 検索候補を取得
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: 検索クエリ
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: 取得件数
      responses:
        "200":
          description: 検索候補一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      type: string
                    example: ["進撃の巨人", "進撃の巨人 Season 2"]
  /search/popular:
    get:
      summary: 人気検索キーワードを取得
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: 取得件数
      responses:
        "200":
          description: 人気検索キーワード一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  popular_searches:
                    type: array
                    items:
                      type: string
                    example: ["進撃の巨人", "鬼滅の刃", "呪術廻戦"]
  /search/history:
    get:
      summary: 検索履歴を取得
      description: ログインユーザーの検索履歴を取得
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
          description: 取得件数（最大50件）
      responses:
        "200":
          description: 検索履歴一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchLog"
                  total:
                    type: integer
        "401":
          description: 認証が必要です
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: 検索履歴を全件削除
      description: ログインユーザーの検索履歴を全て削除
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 検索履歴を削除しました
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "検索履歴を削除しました"
        "401":
          description: 認証が必要です
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /search/history/{id}:
    delete:
      summary: 検索履歴を個別削除
      description: 指定した検索履歴を削除
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 検索履歴ID
      responses:
        "200":
          description: 検索履歴を削除しました
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "検索履歴を削除しました"
        "401":
          description: 認証が必要です
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 検索履歴が見つかりません
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /filters:
    get:
      summary: フィルター情報を取得
      description: 検索フィルターに使用可能なジャンル、年、シーズン、評価情報を取得
      responses:
        "200":
          description: フィルター情報
          content:
            application/json:
              schema:
                type: object
                properties:
                  genres:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        count:
                          type: integer
                  years:
                    type: array
                    items:
                      type: integer
                  seasons:
                    type: array
                    items:
                      type: string
                      enum: ["spring", "summer", "autumn", "winter"]
  /annict/works:
    get:
      summary: Annict APIからアニメ作品を取得
      parameters:
        - name: season
          in: query
          schema:
            type: string
          description: シーズン（例：2025-autumn）
      responses:
        "200":
          description: Annictアニメ作品一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  works:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnnictWork"
                  total_count:
                    type: integer
  /annict/popular-works:
    get:
      summary: Annict APIから人気アニメ作品を取得
      responses:
        "200":
          description: 人気アニメ作品一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  works:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnnictWork"
                  total_count:
                    type: integer
  /annict/test:
    get:
      summary: Annict API接続テスト（開発環境のみ）
      description: Annict APIへの接続をテストします。開発環境でのみ利用可能です。
      responses:
        "200":
          description: 接続成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Annict API connection successful"
        "500":
          description: 接続失敗
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  error:
                    type: string
                    example: "Failed to connect to Annict API"
  /admin/sync/season:
    post:
      summary: シーズンアニメをデータベースに同期（要管理者ロール・非管理者は403）
      security:
        - bearerAuth: []
      parameters:
        - name: season
          in: query
          schema:
            type: string
          description: シーズン（例：2025-autumn）
      responses:
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "200":
          description: 同期成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  synced_count:
                    type: integer
        "401":
          description: 認証が必要です
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/sync/popular:
    post:
      summary: 人気アニメをデータベースに同期（要管理者ロール・非管理者は403）
      security:
        - bearerAuth: []
      responses:
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "200":
          description: 同期成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  synced_count:
                    type: integer
        "401":
          description: 認証が必要です
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/errors/metrics:
    get:
      summary: エラーメトリクスを取得（要管理者ロール・非管理者は403）
      security:
        - bearerAuth: []
      responses:
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "200":
          description: エラーメトリクス
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_errors:
                    type: integer
                  error_rate:
                    type: number
                    format: float
                  errors_by_type:
                    type: object
                    additionalProperties:
                      type: integer
  /admin/errors/top:
    get:
      summary: トップエラーを取得（要管理者ロール・非管理者は403）
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: sort
          in: query
          schema:
            type: string
            enum: ["count", "rate"]
            default: "count"
      responses:
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "200":
          description: トップエラー一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    error_code:
                      type: string
                    count:
                      type: integer
                    rate:
                      type: number
                      format: float
  /admin/errors/reset:
    post:
      summary: エラーメトリクスをリセット（要管理者ロール・非管理者は403）
      security:
        - bearerAuth: []
      responses:
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "200":
          description: リセット成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /admin/sync/genres:
    post:
      summary: アニメジャンル情報をAniList APIから同期（要管理者ロール・非管理者は403）
      description: AniList APIからジャンル情報を取得してデータベースに保存します。MAL IDが設定されている全アニメを処理します。
      security:
        - bearerAuth: []
      responses:
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "200":
          description: ジャンル同期完了
          content:
            application/json:
              schema:
                type: object
                properties:
                  success_count:
                    type: integer
                    description: 成功したアニメ数
                    example: 95
                  failure_count:
                    type: integer
                    description: 失敗したアニメ数
                    example: 5
                  errors:
                    type: array
                    description: エラーメッセージのリスト
                    items:
                      type: string
                    example:
                      - "Anime ID 10 (MAL ID 12345): failed to fetch genres from AniList: Media not found"
                      - "Anime ID 20 (MAL ID 67890): rate limited after 3 attempts"
                  message:
                    type: string
                    description: 処理結果メッセージ
                    example: "Genre sync completed: 95 succeeded, 5 failed"
        "401":
          description: 認証エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/sync/status:
    get:
      summary: 同期ステータスを取得（要管理者ロール・非管理者は403）
      description: アニメ同期スケジューラーの現在のステータスを取得します
      security:
        - bearerAuth: []
      responses:
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "200":
          description: 同期ステータス
          content:
            application/json:
              schema:
                type: object
                properties:
                  last_sync_time:
                    type: string
                    format: date-time
                    description: 最後の同期時刻
                  next_sync_time:
                    type: string
                    format: date-time
                    description: 次回の同期時刻
                  last_sync_duration:
                    type: string
                    description: 最後の同期にかかった時間
                    example: "2m30s"
                  last_sync_success:
                    type: boolean
                    description: 最後の同期が成功したか
                  last_sync_count:
                    type: integer
                    description: 最後の同期で処理したアニメ数
                    example: 95
                  last_sync_errors:
                    type: array
                    items:
                      type: string
                    description: 最後の同期で発生したエラー
                  total_syncs_today:
                    type: integer
                    description: 今日の同期実行回数
                    example: 1
                  is_running:
                    type: boolean
                    description: 現在同期中かどうか
                  enabled:
                    type: boolean
                    description: スケジューラーが有効かどうか
                  current_season:
                    type: string
                    description: 現在のシーズン
                    example: "2025-autumn"
                  previous_season:
                    type: string
                    description: 前シーズン
                    example: "2025-summer"
        "401":
          description: 認証エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: スケジューラーが利用できない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /animes/current:
    get:
      summary: 今期アニメ取得
      description: 現在放送中のシーズンのアニメ一覧をDBから取得します
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 12
            maximum: 100
          description: 取得件数
        - name: random
          in: query
          schema:
            type: boolean
            default: false
          description: >-
            trueのとき、今期アニメをランダムな順序で返す
            （トップページのカルーセル向け）。選出結果はキャッシュしない
      responses:
        "200":
          description: 今期アニメ一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  animes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Anime"
                  total:
                    type: integer
                    description: 返却されたアニメ数
  /animes/popular:
    get:
      summary: 人気アニメ取得
      description: 視聴者数順の人気アニメ一覧をDBから取得します
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 12
            maximum: 100
          description: 取得件数
        - name: random
          in: query
          schema:
            type: boolean
            default: false
          description: >-
            trueのとき、人気上位100件のプールからランダムに選出する
            （トップページのカルーセル向け）。選出結果は一定時間キャッシュされる
      responses:
        "200":
          description: 人気アニメ一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  animes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Anime"
                  total:
                    type: integer
                    description: 返却されたアニメ数
  /admin/sync/statuses:
    post:
      summary: 全アニメのステータスを同期（要管理者ロール・非管理者は403）
      description: season（放送シーズン）とreleased_on（放送開始日）に基づいて全アニメのステータスを更新します。外部API呼び出しなしでDB内のデータのみで判定するため高速に処理されます。
      security:
        - bearerAuth: []
      responses:
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "200":
          description: ステータス同期完了
          content:
            application/json:
              schema:
                type: object
                properties:
                  success_count:
                    type: integer
                    description: 成功したアニメ数
                    example: 95
                  failure_count:
                    type: integer
                    description: 失敗したアニメ数
                    example: 5
                  message:
                    type: string
                    example: "ステータス同期完了: 成功 95件, 失敗 5件"
        "401":
          description: 認証エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/sync/released-on:
    post:
      summary: 放送開始日をJikan APIから同期（要管理者ロール・非管理者は403）
      description: Jikan APIから放送開始日を取得して全アニメのreleased_onフィールドを更新します
      security:
        - bearerAuth: []
      responses:
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "200":
          description: 放送開始日同期完了
          content:
            application/json:
              schema:
                type: object
                properties:
                  success_count:
                    type: integer
                    description: 成功したアニメ数
                    example: 80
                  not_found_count:
                    type: integer
                    description: Jikan APIで見つからなかったアニメ数
                    example: 10
                  failure_count:
                    type: integer
                    description: 失敗したアニメ数
                    example: 5
                  message:
                    type: string
                    example: "released_on同期完了: 成功 80件, 未検出 10件, 失敗 5件"
        "401":
          description: 認証エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/cache/clear:
    post:
      summary: キャッシュクリア（要管理者ロール・非管理者は403）
      description: アニメ関連のキャッシュ（フィルター情報、人気検索、今期アニメ等）をクリアします
      security:
        - bearerAuth: []
      responses:
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "200":
          description: キャッシュクリア成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Cache cleared successfully"
        "401":
          description: 認証エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /health:
    get:
      summary: ヘルスチェック
      responses:
        "200":
          description: サービスは正常です
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  timestamp:
                    type: string
                    format: date-time
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Authが発行するJWTアクセストークン
  responses:
    ForbiddenError:
      description: 管理者権限がありません（管理者以外のユーザー）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        error_code:
          type: string
          example: "VALIDATION_ERROR"
        message:
          type: string
          example: "バリデーションエラーです"
        details:
          type: object
      required:
        - error_code
        - message
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "山田 太郎"
        email:
          type: string
          format: email
          example: "taro@example.com"
        avatar_url:
          type: string
          format: uri
          nullable: true
          description: |
            Googleアカウントのプロフィール画像URL。DBには保持せず、
            認証時にSupabase JWT（user_metadata.avatar_url/picture）から
            都度取得する。未設定の場合は null。
          example: "https://lh3.googleusercontent.com/a/example"
        created_at:
          type: string
          format: date-time
          example: "2025-01-01T00:00:00Z"
    Anime:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        title_kana:
          type: string
          nullable: true
          description: タイトルのふりがな
        title_en:
          type: string
          nullable: true
          description: 英語タイトル
        description:
          type: string
          nullable: true
          description: あらすじ（AniList APIから取得）
        image_url:
          type: string
          format: uri
        season:
          type: string
        status:
          type: string
          enum: ["airing", "finished", "not_yet_aired", "upcoming"]
        media:
          type: string
          nullable: true
          description: メディアタイプ（TV, OVA, Movie等）
        released_on:
          type: string
          nullable: true
          description: 放送開始日（YYYY-MM-DD形式）
        official_site_url:
          type: string
          format: uri
          nullable: true
          description: 公式サイトURL
        watchers_count:
          type: integer
          description: 視聴者数
        mal_anime_id:
          type: string
          nullable: true
          description: MyAnimeList ID
        annict_id:
          type: integer
          nullable: true
          description: Annict ID
        genres:
          type: array
          items:
            type: string
          description: ジャンル一覧
        cover_image_extra_large:
          type: string
          format: uri
          description: AniList API から取得した最高画質のカバー画像URL（extraLargeサイズ）
        cover_image_large:
          type: string
          format: uri
          description: AniList API から取得した大サイズのカバー画像URL
        cover_image_medium:
          type: string
          format: uri
          description: AniList API から取得した中サイズのカバー画像URL
        series_title:
          type: string
          description: シリーズ名（正規化後、内部識別用）
        series_tmdb_id:
          type: integer
          description: シリーズ代表のTMDB ID（あらすじ・配信サービス取得用）
        broadcast_day:
          type: string
          nullable: true
          description: 放送曜日（例：Fridays）
          example: "Fridays"
        broadcast_time:
          type: string
          nullable: true
          description: 放送時間（例：23:30）
          example: "23:30"
        broadcast_timezone:
          type: string
          nullable: true
          description: タイムゾーン（例：Asia/Tokyo）
          example: "Asia/Tokyo"
        duration_minutes:
          type: integer
          nullable: true
          description: 映画作品の上映時間（分）。TVアニメの場合はnull。
          example: 120
        user_favorite:
          $ref: "#/components/schemas/Favorite"
          nullable: true
          description: ユーザーのお気に入り（ハート）情報（認証時のみ）
        user_watch_status:
          $ref: "#/components/schemas/WatchStatus"
          nullable: true
          description: ユーザーの視聴ステータス情報（認証時のみ）
        watch_providers:
          type: array
          items:
            $ref: "#/components/schemas/WatchProvider"
          description: 配信サービス一覧
        related_seasons:
          type: array
          items:
            $ref: "#/components/schemas/RelatedAnime"
          description: 同シリーズの他シーズン（続編・前作）。タイトルの季節サフィックスを除いた series_title が一致する作品を放送時期順に返す。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WatchProvider:
      type: object
      required:
        - provider_id
        - provider_name
        - logo_url
      properties:
        provider_id:
          type: integer
          description: 配信サービスID
        provider_name:
          type: string
          description: 配信サービス名
        logo_url:
          type: string
          format: uri
          description: ロゴ画像URL
    RelatedAnime:
      type: object
      required:
        - id
        - title
        - season
        - image_url
      properties:
        id:
          type: integer
        title:
          type: string
        season:
          type: string
          nullable: true
          description: "放送時期（例：2025-summer）"
        cover_image_extra_large:
          type: string
          format: uri
          description: AniListカバー画像（最大解像度、未取得の場合は省略）
        cover_image_large:
          type: string
          format: uri
          description: AniListカバー画像（大、未取得の場合は省略）
        cover_image_medium:
          type: string
          format: uri
          description: AniListカバー画像（小、未取得の場合は省略）
        image_url:
          type: string
          nullable: true
          description: Annict画像URL（フォールバック用）
    Favorite:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        anime_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WatchStatus:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        anime_id:
          type: integer
        status:
          type: string
          enum: ["watching", "completed", "planned"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SearchResultAnime:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        genre:
          type: array
          items:
            type: string
    AnnictWork:
      type: object
      properties:
        id:
          type: integer
          description: Annict作品ID
        title:
          type: string
          description: 作品タイトル
        title_kana:
          type: string
          description: 作品タイトル（かな）
        title_en:
          type: string
          description: 作品タイトル（英語）
        media:
          type: string
          description: メディアタイプコード
          example: "tv"
        media_text:
          type: string
          description: メディアタイプ表示名
          example: "TV"
        season_name:
          type: string
          description: シーズン名
          example: "2025-autumn"
        season_year:
          type: integer
          description: 放送年
          example: 2025
        released_on:
          type: string
          description: 放送開始日
          example: "2025-10-01"
        released_on_about:
          type: string
          description: 放送開始日（概算）
          example: "2025年10月"
        official_site_url:
          type: string
          format: uri
          description: 公式サイトURL
        wikipedia_url:
          type: string
          format: uri
          description: Wikipedia URL
        twitter_username:
          type: string
          description: Twitter ユーザー名
        twitter_hashtag:
          type: string
          description: Twitter ハッシュタグ
        mal_anime_id:
          type: string
          nullable: true
          description: MyAnimeList ID（nullの場合あり）
        images:
          type: object
          nullable: true
          description: Annict API画像情報
          properties:
            recommended_url:
              type: string
              format: uri
            facebook:
              type: object
              nullable: true
              properties:
                og_image_url:
                  type: string
                  format: uri
            twitter:
              type: object
              nullable: true
              properties:
                mini_avatar_url:
                  type: string
                  format: uri
                normal_avatar_url:
                  type: string
                  format: uri
                bigger_avatar_url:
                  type: string
                  format: uri
                original_avatar_url:
                  type: string
                  format: uri
                image_url:
                  type: string
                  format: uri
        watchers_count:
          type: integer
          description: 視聴者数
          example: 1000
        reviews_count:
          type: integer
          description: レビュー数
          example: 50
        cover_image_extra_large:
          type: string
          format: uri
          description: AniList APIから取得した最高画質カバー画像URL（extraLargeサイズ）
        cover_image_large:
          type: string
          format: uri
          description: AniList APIから取得した大サイズカバー画像URL
        cover_image_medium:
          type: string
          format: uri
          description: AniList APIから取得した中サイズカバー画像URL
    SearchLog:
      type: object
      properties:
        id:
          type: integer
          description: 検索ログID
        user_id:
          type: integer
          nullable: true
          description: ユーザーID
        query:
          type: string
          description: 検索クエリ
          example: "進撃の巨人"
        filters:
          type: string
          description: 検索フィルター（JSON文字列）
          example: '{"genre":"action","season":"2025-winter"}'
        result_count:
          type: integer
          description: 検索結果件数
          example: 15
        clicked_anime_id:
          type: integer
          nullable: true
          description: クリックしたアニメID
        searched_at:
          type: string
          format: date-time
          description: 検索日時
          example: "2025-01-15T12:30:00Z"
