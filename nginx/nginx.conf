# nginx/nginx.conf
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # フロントエンド (Next.js) サーバー
    upstream frontend_app {
        server frontend:3000; # 'frontend'はdocker-composeのサービス名
    }

    # バックエンド (Go) APIサーバー
    upstream backend_app {
        server backend:8080; # 'backend'はdocker-composeのサービス名
    }

    server {
        listen 80;
        server_name localhost; # 本番環境ではドメインに置き換えてください

        # Next.jsビルドからの静的ファイルを配信
        location /_next/static/ {
            proxy_pass http://frontend_app;
            expires 1y;
            add_header Cache-Control "public";
        }

        # APIリクエストをバックエンドにプロキシ
        location /api/ {
            proxy_pass http://backend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # その他のすべてのリクエストはフロントエンドへ
        location / {
            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # オプション: HTTPSサーバーブロック (本番環境用にコメント解除して設定)
