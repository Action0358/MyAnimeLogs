name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          # ランナーのプリインストール版(古いパッチ)ではなく最新パッチを取得する。
          # 未指定だと govulncheck が修正済みの標準ライブラリ脆弱性を検出してCIが落ちる
          check-latest: true

      - name: Run backend tests
        working-directory: ./backend
        run: |
          go mod download
          go test -v ./...

  deploy-backend-production:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy Backend to Fly.io Production
        run: |
          # --yes は非対話環境で必須。マシン構成の変更（ボリュームの着脱など）を
          # 検出すると flyctl が確認を求め、CI では応答できず中断するため
          # （#763 でボリュームを外した際に発生）。
          # 全試行が失敗したら必ず非ゼロで終了すること。
          # break 方式ではループ末尾の sleep が成功扱いになり、デプロイが
          # 3回とも失敗してもジョブが success になる（2026-08-16 に発生）。
          for i in 1 2 3; do
            if flyctl deploy -c fly.toml -a myanimelogs-production --ha=false --wait-timeout=600 --depot=false --yes; then
              echo "Deploy succeeded on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed"
            if [ "$i" -lt 3 ]; then
              echo "Retrying in 30s..."
              sleep 30
            fi
          done
          echo "All 3 deploy attempts failed"
          exit 1
        working-directory: ./backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PRODUCTION }}

      - name: Get Fly.io App Logs for Debugging
        run: |
          echo "Getting recent logs..."
          timeout 10s flyctl logs -a myanimelogs-production --no-tail || echo "Log fetch completed or timed out"
        working-directory: ./backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PRODUCTION }}

      - name: Wait for production deployment to be ready
        run: |
          echo "Waiting for deployment to be ready..."
          sleep 60
          echo "Deployment should be ready. Migrations run automatically on startup."
        working-directory: ./backend

      - name: Verify deployment
        run: |
          sleep 30
          chmod +x scripts/verify-deployment.sh
          ./scripts/verify-deployment.sh production
        working-directory: ./backend

      # Supabase Auth移行により /api/login エンドポイントが廃止されたため
      # デプロイ後のデータ同期は手動で実行してください

  deploy-frontend-production:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build:production
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL_PRODUCTION }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_PRODUCTION }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_PRODUCTION }}
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages (Production)
        working-directory: ./frontend
        run: npx wrangler@3 pages deploy out --project-name=myanimelogs --branch=main --commit-message="Deploy production $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
