name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run backend tests
        working-directory: ./backend
        run: |
          go mod download
          go test -v ./...

  deploy-production:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io Production
        run: flyctl deploy -c fly.toml -a myanimelogs-production
        working-directory: ./backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PRODUCTION }}

      - name: Get Fly.io App Logs for Debugging
        run: flyctl logs -a myanimelogs-production --last 100
        working-directory: ./backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PRODUCTION }}

      - name: Start production VM and run migrations
        run: |
          echo "Getting machine ID..."
          MACHINE_ID=$(flyctl machine list -a myanimelogs-production --json | jq -r '.[0].id')
          echo "Machine ID: $MACHINE_ID"

          echo "Starting production VM..."
          flyctl machine start $MACHINE_ID -a myanimelogs-production

          echo "Waiting for VM to be ready..."
          sleep 30

          echo "Running database migrations..."
          flyctl ssh console -c "cd /app && ./migrate" -a myanimelogs-production
        working-directory: ./backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PRODUCTION }}

      - name: Verify deployment
        run: |
          sleep 30
          chmod +x scripts/verify-deployment.sh
          ./scripts/verify-deployment.sh production
        working-directory: ./backend
