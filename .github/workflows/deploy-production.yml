name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run backend tests
        working-directory: ./backend
        run: |
          go mod download
          go test -v ./...

  deploy-production:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io Production
        run: flyctl deploy -c fly.toml -a myanimelogs-production
        working-directory: ./backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PRODUCTION }}

      - name: Wait for deployment to start
        run: |
          echo "Waiting for deployment to start..."
          sleep 30
        working-directory: ./backend

      - name: Get Fly.io App Logs for Debugging
        run: |
          echo "Getting recent logs..."
          flyctl logs -a myanimelogs-production --no-tail || echo "Log fetch completed"
        working-directory: ./backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PRODUCTION }}

      - name: Check app status
        run: |
          echo "Checking app status..."
          flyctl status -a myanimelogs-production || echo "Status check completed"
        working-directory: ./backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PRODUCTION }}

      - name: Wait for production deployment to be ready
        run: |
          echo "Waiting for deployment to be ready..."
          sleep 60
          echo "Deployment should be ready. Migrations run automatically on startup."
        working-directory: ./backend

      - name: Additional health check wait
        run: |
          echo "Additional wait for production stability..."
          sleep 30
        working-directory: ./backend

      - name: Verify deployment
        run: |
          chmod +x scripts/verify-deployment.sh
          ./scripts/verify-deployment.sh production
        working-directory: ./backend

      - name: Final production logs
        if: failure()
        run: |
          echo "Deployment verification failed, getting final logs..."
          flyctl logs -a myanimelogs-production --no-tail || echo "Final log fetch completed"
        working-directory: ./backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PRODUCTION }}
