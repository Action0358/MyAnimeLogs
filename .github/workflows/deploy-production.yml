name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run backend tests
        working-directory: ./backend
        run: |
          go mod download
          go test -v ./...

  deploy-production:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io Production
        run: flyctl deploy -c fly.toml -a myanimelogs-production
        working-directory: ./backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PRODUCTION }}

      - name: Get Fly.io App Logs for Debugging
        run: |
          echo "Getting recent logs..."
          timeout 10s flyctl logs -a myanimelogs-production --no-tail || echo "Log fetch completed or timed out"
        working-directory: ./backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PRODUCTION }}

      - name: Wait for production deployment to be ready
        run: |
          echo "Waiting for deployment to be ready..."
          sleep 60
          echo "Deployment should be ready. Migrations run automatically on startup."
        working-directory: ./backend

      - name: Verify deployment
        run: |
          sleep 30
          chmod +x scripts/verify-deployment.sh
          ./scripts/verify-deployment.sh production
        working-directory: ./backend

      - name: Sync anime data after deployment
        run: |
          echo "Syncing anime data to database..."
          
          # Secretsが設定されているか確認
          if [ -z "${{ secrets.ADMIN_EMAIL }}" ] || [ -z "${{ secrets.ADMIN_PASSWORD }}" ]; then
            echo "ADMIN_EMAIL or ADMIN_PASSWORD not set. Skipping data sync."
            echo "To enable automatic data sync, set ADMIN_EMAIL and ADMIN_PASSWORD in GitHub Secrets."
            exit 0
          fi
          
          # ログインしてトークンを取得
          LOGIN_RESPONSE=$(curl -s -X POST "https://myanimelogs-production.fly.dev/api/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${{ secrets.ADMIN_EMAIL }}\",\"password\":\"${{ secrets.ADMIN_PASSWORD }}\"}")
          
          TOKEN=$(echo "$LOGIN_RESPONSE" | grep -o '"access_token":"[^"]*' | cut -d'"' -f4)
          
          if [ -z "$TOKEN" ]; then
            echo "Failed to login. Skipping data sync."
            exit 0
          fi
          
          # 現在のシーズンのアニメを同期
          echo "Syncing current season anime..."
          curl -s -X POST "https://myanimelogs-production.fly.dev/api/admin/sync/season" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json"
          
          sleep 2
          
          # 人気アニメを同期
          echo "Syncing popular anime..."
          curl -s -X POST "https://myanimelogs-production.fly.dev/api/admin/sync/popular" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json"
          
          echo "Data sync completed"
        working-directory: ./backend
