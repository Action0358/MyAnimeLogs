name: Deploy to Staging

on:
  push:
    branches: [staging]
  # プルリクエストでは実行しない（mainブランチへのPRでステージングデプロイを防ぐ）

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run backend tests
        working-directory: ./backend
        run: |
          go mod download
          go test -v ./...

  deploy-backend-staging:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io Staging
        run: |
          for i in 1 2 3; do
            flyctl deploy -c fly.staging.toml -a myanimelogs-staging --ha=false --wait-timeout=600 --depot=false && break
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done
        working-directory: ./backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}

      - name: Get Fly.io App Logs for Debugging
        run: |
          echo "Getting recent logs..."
          timeout 10s flyctl logs -a myanimelogs-staging --no-tail || echo "Log fetch completed or timed out"
        working-directory: ./backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}

      - name: Wait for staging deployment to be ready
        run: |
          echo "Waiting for deployment to be ready..."
          sleep 60
          echo "Deployment should be ready. Migrations run automatically on startup."
        working-directory: ./backend

      - name: Verify deployment
        run: |
          sleep 30
          chmod +x scripts/verify-deployment.sh
          ./scripts/verify-deployment.sh staging
        working-directory: ./backend

      # Supabase Auth移行により /api/login エンドポイントが廃止されたため
      # デプロイ後のデータ同期は手動で実行してください

  deploy-frontend-staging:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build:staging
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL_STAGING }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_STAGING }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_STAGING }}
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages (Staging)
        working-directory: ./frontend
        run: npx wrangler@3 pages deploy out --project-name=myanimelogs-staging --branch=staging --commit-message="Deploy staging $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
