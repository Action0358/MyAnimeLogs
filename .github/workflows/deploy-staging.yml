name: Deploy to Staging

on:
  push:
    branches: [staging]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run backend tests
        working-directory: ./backend
        run: |
          go mod download
          go test -v ./...

  deploy-staging:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io Staging
        run: flyctl deploy -c fly.staging.toml -a myanimelogs-staging
        working-directory: ./backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}

      - name: Get Fly.io App Logs for Debugging
        run: flyctl logs -a myanimelogs-staging --last 100
        working-directory: ./backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}

      - name: Start staging VM and run migrations
        run: |
          echo "Getting machine ID..."
          MACHINE_ID=$(flyctl machine list -a myanimelogs-staging --json | jq -r '.[0].id')
          echo "Machine ID: $MACHINE_ID"
          
          echo "Starting staging VM..."
          flyctl machine start $MACHINE_ID -a myanimelogs-staging
          
          echo "Waiting for VM to be ready..."
          sleep 30
          
          echo "Running database migrations..."
          flyctl ssh console -c "cd /app && ./migrate" -a myanimelogs-staging
        working-directory: ./backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}

      - name: Verify deployment
        run: |
          sleep 30
          chmod +x scripts/verify-deployment.sh
          ./scripts/verify-deployment.sh staging
        working-directory: ./backend
