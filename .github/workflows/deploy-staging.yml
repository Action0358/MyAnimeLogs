name: Deploy to Staging

on:
  push:
    branches: [staging]
  # プルリクエストでは実行しない（mainブランチへのPRでステージングデプロイを防ぐ）

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run backend tests
        working-directory: ./backend
        run: |
          go mod download
          go test -v ./...

  deploy-staging:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io Staging
        run: flyctl deploy -c fly.staging.toml -a myanimelogs-staging
        working-directory: ./backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}

      - name: Wait for deployment to start
        run: |
          echo "Waiting for deployment to start..."
          sleep 30
        working-directory: ./backend

      - name: Get Fly.io App Logs for Debugging
        run: |
          echo "Getting recent logs..."
          flyctl logs -a myanimelogs-staging --no-tail || echo "Log fetch completed"
        working-directory: ./backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}

      - name: Check app status
        run: |
          echo "Checking app status..."
          flyctl status -a myanimelogs-staging || echo "Status check completed"
        working-directory: ./backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}

      - name: Wait for staging deployment to be ready
        run: |
          echo "Waiting for deployment to be ready..."
          sleep 60
          echo "Deployment should be ready. Migrations run automatically on startup."
        working-directory: ./backend

      - name: Verify deployment
        run: |
          sleep 30
          chmod +x scripts/verify-deployment.sh
          ./scripts/verify-deployment.sh staging
        working-directory: ./backend
