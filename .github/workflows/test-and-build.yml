name: Test and Build

on:
  pull_request:
    branches: [ main, staging, develop ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          # ランナーのプリインストール版(古いパッチ)ではなく最新パッチを取得する。
          # 未指定だと govulncheck が修正済みの標準ライブラリ脆弱性を検出してCIが落ちる
          check-latest: true

      - name: Run tests
        working-directory: ./backend
        run: |
          go mod download
          go test -v ./...

      # main/stagingへのマージはデプロイに直結するため、デプロイ前提の検証を
      # ここでまとめて行う（旧test-pr.ymlの統合。developへのPRでは不要）
      - name: Build application
        if: github.base_ref != 'develop'
        working-directory: ./backend
        run: go build -o /tmp/test-build ./cmd/server

      - name: Verify Docker build
        if: github.base_ref != 'develop'
        working-directory: ./backend
        run: |
          docker build -f Dockerfile.prod -t test-pr-build .
          echo "Docker build successful"

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          # ランナーのキャッシュ版（古いパッチ）ではなく最新パッチを取得する。
          # 未指定だとセキュリティ修正前の版のままビルド・テストが走る
          check-latest: true
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      # 規約違反・書式のずれを main に入れない（#1147）。
      # 警告は許容し、エラーだけで落とす
      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      # 型エラーはテストより先に落としたほうがフィードバックが速い。
      # jest は SWC でトランスパイルするだけで型を見ないため、
      # これがないと型エラーがテスト成功のまま本番まで抜ける（#872）。
      - name: Type check
        working-directory: ./frontend
        run: npm run type-check

      - name: Run tests
        working-directory: ./frontend
        run: npm test

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # backend: 呼び出し済み脆弱性を検出したらCIを落とす(ブロッキング)
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          # ランナーのプリインストール版(古いパッチ)ではなく最新パッチを取得する。
          # 未指定だと govulncheck が修正済みの標準ライブラリ脆弱性を検出してCIが落ちる
          check-latest: true

      - name: Run govulncheck (backend)
        working-directory: ./backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # frontend: 大半がビルドツール系の推移的依存のためレポートのみ(非ブロッキング)
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          # ランナーのキャッシュ版（古いパッチ）ではなく最新パッチを取得する。
          # 未指定だとセキュリティ修正前の版のままビルド・テストが走る
          check-latest: true
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Run npm audit (frontend, report-only)
        working-directory: ./frontend
        continue-on-error: true
        run: npm audit
