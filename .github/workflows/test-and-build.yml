name: Test and Build

on:
  pull_request:
    branches: [ main, staging, develop ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          # ランナーのプリインストール版(古いパッチ)ではなく最新パッチを取得する。
          # 未指定だと govulncheck が修正済みの標準ライブラリ脆弱性を検出してCIが落ちる
          check-latest: true

      - name: Run tests
        working-directory: ./backend
        run: |
          go mod download
          go test -v ./...

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run tests
        working-directory: ./frontend
        run: npm test

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # backend: 呼び出し済み脆弱性を検出したらCIを落とす(ブロッキング)
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          # ランナーのプリインストール版(古いパッチ)ではなく最新パッチを取得する。
          # 未指定だと govulncheck が修正済みの標準ライブラリ脆弱性を検出してCIが落ちる
          check-latest: true

      - name: Run govulncheck (backend)
        working-directory: ./backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # frontend: 大半がビルドツール系の推移的依存のためレポートのみ(非ブロッキング)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Run npm audit (frontend, report-only)
        working-directory: ./frontend
        continue-on-error: true
        run: npm audit
