version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: myanimelogs-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myanimelogs}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - myanimelogs-network

  # pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: myanimelogs-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@myanimelogs.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - myanimelogs-network

  # Redis (Optional - for caching)
  redis:
    image: redis:7-alpine
    container_name: myanimelogs-redis
    ports:
      - "6379:6379"
    networks:
      - myanimelogs-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myanimelogs-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-myanimelogs}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-key}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      REDIS_URL: redis://redis:6379
      PORT: 8080
      ENVIRONMENT: development
      RATE_LIMIT: 5
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    networks:
      - myanimelogs-network

volumes:
  postgres_data:

networks:
  myanimelogs-network:
    driver: bridge