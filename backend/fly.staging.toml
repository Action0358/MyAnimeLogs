# fly.toml app configuration file for staging environment
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'myanimelogs-staging'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile.prod'

[deploy]
  # Note: release_command runs as root due to Fly.io constraints with ENTRYPOINT.
  # The migrate binary and migrations directory are owned by appuser:appgroup,
  # and database access is controlled by DATABASE_URL credentials, not OS user.
  # This is a safe configuration for database migrations.
  release_command = '/app/migrate'
  release_command_timeout = '300s'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[env]
  ENVIRONMENT = "staging"
  ANIME_SYNC_ENABLED = "true"
  # アカウント削除で Supabase Admin API を呼ぶためのベースURL。
  # 機微情報ではないためシークレットにせずここで管理する。
  # 対になる SUPABASE_SERVICE_ROLE_KEY は flyctl secrets set で設定すること。
  SUPABASE_URL = "https://lvvyolsqhtzfgxsheikr.supabase.co"
  # サーバーはUTC運用を明示的に固定。18:00 UTC = 03:00 JST に日次同期を実行
  TZ = "UTC"
  SCHEDULER_RUN_HOUR = "18"

# Persistent storage for uploaded files
# 永続ボリュームは廃止した（#763 / #760）。
# アイコンをプリセット選択方式へ変更しファイル保存が不要になったため。
# ボリュームがあるとマシンが特定のホストに固定され、そのホストのCPUに
# 空きがないとデプロイが失敗していた（insufficient CPUs）。
# ボリュームを外すことで、Fly.io が空いている任意のホストへ配置できる。

# Staging specific settings
[experimental]
  auto_rollback = true

# Health checks for staging
[checks]
  [checks.health]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    port = 8080
    timeout = "10s"
    type = "http"