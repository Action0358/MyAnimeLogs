# fly.toml app configuration file generated for myanimelogs-production on 2025-09-06T01:59:35+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'myanimelogs-production'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile.prod'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[env]
  ENVIRONMENT = "production"

# Production specific settings
[experimental]
  auto_rollback = true

# Health checks for production
[checks]
  [checks.health]
    grace_period = "15s"
    interval = "60s"
    method = "GET"
    path = "/health"
    port = 8080
    timeout = "10s"
    type = "http"
