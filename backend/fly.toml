# fly.toml app configuration file generated for myanimelogs-backend on 2025-09-04T03:52:21+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'myanimelogs-backend'
primary_region = 'nrt'

[build]
  dockerfile = "Dockerfile.prod"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
