services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: myanimelogs_frontend
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
      - /frontend/.next
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev"
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myanimelogs_backend
    volumes:
      - ./backend:/backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "go run scripts/migrate.go && air -c .air.toml"

  postgres:
    image: postgres:16
    container_name: myanimelogs_postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file:
      - ./backend/.env.local
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_DB: ${POSTGRES_DB:-myanimelogs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]

  redis:
    image: redis:7-alpine
    container_name: myanimelogs_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  pgadmin:
    image: dpage/pgadmin4
    container_name: myanimelogs_pgadmin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    env_file:
      - ./backend/.env.local
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
