services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: myanimelogs_frontend
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev"
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myanimelogs_backend
    volumes:
      - ./backend:/backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env.local
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "go run scripts/migrate.go && air -c .air.toml"

  postgres:
    image: postgres:16
    container_name: myanimelogs_postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file:
      - ./backend/.env.local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: myanimelogs_pgadmin
    ports:
      - "5050:80"
    env_file:
      - ./backend/.env.local
    depends_on:
      - postgres

volumes:
  postgres_data:
